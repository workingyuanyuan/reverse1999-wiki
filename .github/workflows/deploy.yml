name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build, then run the acceptance checks. A failed check stops the deploy.
      - run: pnpm verify
      # Compare the hash of each page's Markdown twin with the hashes the live site published,
      # before the deploy replaces them. A failed comparison shows as a warning and submits
      # nothing; it does not block the deploy. The body goes as an artifact: with thousands of
      # URLs it is too large for a job output or an environment variable.
      - id: indexnow
        continue-on-error: true
        run: |
          node scripts/indexnow.mjs > indexnow-body.json
          if [ -s indexnow-body.json ]; then echo 'changed=yes' >> "$GITHUB_OUTPUT"; fi
      - if: steps.indexnow.outputs.changed == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-body
          path: indexnow-body.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell IndexNow search engines (Bing, Yandex and others; not Google) which pages changed.
  indexnow:
    needs: [build, deploy]
    if: needs.build.outputs.indexnow != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-body
      - run: >
          curl --silent --show-error --fail-with-body -X POST
          -H 'Content-Type: application/json; charset=utf-8'
          --data-binary @indexnow-body.json https://api.indexnow.org/indexnow
          -w 'IndexNow HTTP %{http_code}\n'
